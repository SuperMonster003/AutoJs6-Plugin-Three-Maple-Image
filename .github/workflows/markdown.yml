name: Markdown integrity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  markdown:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==12.3.0
      - run: python .python/generate_markdown.py --check
      - run: python -m unittest discover -s .python/tests
